name: Tests

# Fast feedback on every push to any branch and on pull requests: one build on Linux, then the
# C++ test programs and the Python test suite (with coverage). Each task branch is tested as
# soon as it is pushed; a newer push to the same branch cancels the older run. The full wheel
# matrix (wheels.yml) runs on master, on tags, and by hand on a branch that changes the build.

on:
  push:
    # Every branch except the ones that only hold generated data. Tag pushes do not trigger it.
    branches-ignore: [gh-pages, python-coverage-comment-action-data]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the badge job below gets write access.
permissions:
  contents: read

jobs:
  hygiene:
    # No personal paths or tool/environment files in the repository (SECURITY.md).
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tracked files
        run: python3 scripts/check_repo_hygiene.py

  linux:
    name: Build and test (Linux, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_PATH: ${{ github.workspace }}
      EGTTOOLS_EXTRA_CMAKE_ARGS: -DUSE_OPENMP=ON -DBUILD_NUMERICAL_TESTS=ON

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history and tags: setuptools-scm derives the version from them.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages (OpenMP, BLAS/LAPACK)
        run: bash build_tools/github/install_blas_openmp.sh

      - name: Setup cache for vcpkg
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ./vcpkg_installed
            ./vcpkg/buildtrees
            ./vcpkg/downloads
            ./vcpkg/packages
          key: tests-${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            tests-${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh --disableMetrics

      - name: Install dependencies with vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        # --x-feature=tests adds Catch2 for the C++ tests (BUILD_NUMERICAL_TESTS=ON).
        run: ./vcpkg/vcpkg install --x-binarycaching --x-feature=tests

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Build backend requirements (see [build-system] in pyproject.toml); cmake < 4 because the
          # pinned vcpkg submodule still uses cmake_minimum_required < 3.5.
          python -m pip install "setuptools>=44" wheel "scikit-build>=0.13.1" "cmake>=3.27,<4" ninja \
            "setuptools-scm>=7" pytest coverage
          # Runtime dependencies, read from pyproject.toml so they stay in sync.
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" \
            > runtime-requirements.txt
          python -m pip install -r runtime-requirements.txt

      - name: Build extension and C++ tests in place
        run: python setup.py build_ext --inplace

      - name: Run C++ tests
        # One Catch2 program; each test case is a CTest test. tests/CMakeLists.txt keeps the library's
        # assert()s enabled in this Release build.
        run: ctest --test-dir "$(ls -d _skbuild/*/cmake-build)/tests" --output-on-failure --timeout 600

      - name: Run Python tests (with coverage)
        # Coverage settings are in [tool.coverage] in pyproject.toml.
        run: python -m coverage run -m pytest tests -m "not slow" -p no:cacheprovider -ra

      - name: Check that the type stubs are up to date
        # Regenerates the .pyi stubs from the extension just built; fails if they differ from the
        # committed ones (regenerate them with the command below and commit the result).
        env:
          PYTHONPATH: src
        run: |
          python -m pip install "pybind11-stubgen==2.5.1"
          pybind11-stubgen egttools.numerical.numerical_ -o src
          if ! git diff --exit-code --stat -- 'src/**/*.pyi'; then
            echo "::error::The .pyi stubs are out of date. Run: pip install pybind11-stubgen==2.5.1 && pybind11-stubgen egttools.numerical.numerical_ -o src"
            git diff -- 'src/**/*.pyi' | head -100
            exit 1
          fi

      - name: Coverage summary
        run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 7

  sanitizers:
    # The C++ test programs built with AddressSanitizer (+ LeakSanitizer on Linux) and
    # UndefinedBehaviorSanitizer (EGTTOOLS_SANITIZE, cmake/Modules/EnableSanitizers.cmake), with
    # clang and its OpenMP runtime. Only the test programs are built, not the Python extension.
    # testSanitizerCanary_* checks that the build is instrumented.
    name: C++ tests under ASan + UBSan (Linux, clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history and tags: CMake derives the project version from them.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system packages (OpenMP, BLAS/LAPACK)
        run: bash build_tools/github/install_blas_openmp.sh

      - name: Setup cache for vcpkg
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ./vcpkg_installed
            ./vcpkg/buildtrees
            ./vcpkg/downloads
            ./vcpkg/packages
          key: sanitizers-${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            sanitizers-${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh --disableMetrics

      - name: Install dependencies with vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        # --x-feature=tests adds Catch2 for the C++ tests (BUILD_NUMERICAL_TESTS=ON).
        run: ./vcpkg/vcpkg install --x-binarycaching --x-feature=tests

      - name: Install build tools
        # cmake < 4 because the pinned vcpkg submodule still uses cmake_minimum_required < 3.5.
        run: python -m pip install "cmake>=3.27,<4" ninja

      - name: Configure (sanitizer build)
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF \
            -DPython_EXECUTABLE="$(which python)" \
            -DUSE_OPENMP=ON -DBUILD_NUMERICAL_TESTS=ON \
            "-DEGTTOOLS_SANITIZE=address;undefined"

      - name: Build the C++ test programs
        run: cmake --build build-sanitize --parallel --target egttools_cpp_tests

      - name: Run the C++ tests
        run: ctest --test-dir build-sanitize/tests --output-on-failure --timeout 900

  coverage-badge:
    # Updates the README coverage badge and the HTML report in the
    # python-coverage-comment-action-data branch. Only after changes reach master, and in a
    # separate job: the third-party action never runs alongside the build, and is the only
    # code that receives a token able to push.
    name: Update coverage badge
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data

      - name: Update badge and report
        uses: py-cov-action/python-coverage-comment-action@07249dd712cd2464873eb8a59a24f97fd281e76f # v4.6
        with:
          GITHUB_TOKEN: ${{ github.token }}
