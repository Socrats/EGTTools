name: Publish to Pypi
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to upload, e.g. 0.2.0rc1 (its GitHub release v<version> must be published)'
        required: true
      pypi_repo:
        description: 'Repo to upload to (testpypi or pypi)'
        default: 'testpypi'
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -U wheelhouse_uploader pyyaml
      - name: Downloading wheels and sdist from staging
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "Socrats/EGTtools"
          # The release for the requested version (not "latest", which skips pre-releases).
          tag: "v${{ github.event.inputs.version }}"
          fileName: "*"
          out-file-path: "dist/"
      - name: Check that wheels exist
        run: |
          ls dist/*.whl || (echo "No wheels found!" && exit 1)
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
        if: ${{ github.event.inputs.pypi_repo == 'testpypi' }}
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
        if: ${{ github.event.inputs.pypi_repo == 'pypi' }}