{% set name = "egttools" %}
{% set version = "0.1.15" %}

{# Resolve variant flags from conda_build_config.yaml.
   arpack_variant / mpi_variant are "" (base) or a non-empty string (enabled). #}
{% set use_arpack = arpack_variant | default("") != "" %}
{% set use_mpi    = mpi_variant    | default("") != "" %}

{# Build-string prefix encodes which optional C libraries are compiled in,
   giving each variant a unique, human-readable build string. #}
{% set variant_prefix = "" %}
{% if use_arpack %}{% set variant_prefix = "arpack_" %}{% endif %}
{% if use_mpi    %}{% set variant_prefix = variant_prefix + "mpi_" %}{% endif %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ../.

build:
  noarch: false  # C++ extension: NOT noarch
  number: 0
  string: "{{ variant_prefix }}py{{ PY_VER | replace('.','') }}_{{ PKG_BUILDNUM }}"
  script_env:
    # Passed to CMake so it can generate version.h without a git checkout
    # (conda-forge builds from a PyPI sdist tarball, so .git is absent).
    - EGTTOOLS_VERSION={{ version }}
    # Optional feature flags — values rendered by Jinja2 at recipe-parse time.
    - EGTTOOLS_ENABLE_ARPACK={{ "ON" if use_arpack else "OFF" }}
    - EGTTOOLS_ENABLE_PETSC={{ "ON" if use_mpi else "OFF" }}
  script:
    # Append our feature flags to CMAKE_ARGS so scikit-build forwards them.
    # SKIP_VCPKG prevents vcpkg from interfering in the conda build environment.
    - export CMAKE_ARGS="${CMAKE_ARGS:-} -DEGTTOOLS_ENABLE_ARPACK=${EGTTOOLS_ENABLE_ARPACK} -DEGTTOOLS_ENABLE_PETSC=${EGTTOOLS_ENABLE_PETSC} -DSKIP_VCPKG=ON"  # [unix]
    - set "CMAKE_ARGS=%CMAKE_ARGS% -DEGTTOOLS_ENABLE_ARPACK=%EGTTOOLS_ENABLE_ARPACK% -DEGTTOOLS_ENABLE_PETSC=%EGTTOOLS_ENABLE_PETSC% -DSKIP_VCPKG=ON"  # [win]
    - {{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.27
    - ninja
{% if use_mpi %}
    - pkg-config  # needed to locate PETSc/SLEPc via pkg_check_modules
{% endif %}
  host:
    - python
    - pip
    - scikit-build >=0.13.1
    - setuptools >=44
    - wheel
    - pybind11 >=2.10
    - numpy >=1.26.3
    - eigen >=3.4.0
    - boost-cpp >=1.82.0
    - libblas
    - liblapack
    - liblapacke
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
{% if use_arpack %}
    - arpack
{% endif %}
{% if use_mpi %}
    - petsc >=3.20
    - slepc >=3.20
    - openmpi
{% endif %}
  run:
    - python
    - numpy >=1.26.3
    - scipy >=1.12.0
    - matplotlib >=3.8.2
    - seaborn >=0.13.2
    - networkx >=3.2.1
    - plotly >=5.0.0
    - libblas
    - liblapack
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
{% if use_arpack %}
    - arpack
{% endif %}
{% if use_mpi %}
    - petsc >=3.20
    - slepc >=3.20
    - mpi4py >=3.1
{% endif %}

test:
  imports:
    - egttools
    - egttools.numerical
    - egttools.games
    - egttools.behaviors
    - egttools.analytical
    - egttools.datastructures
    - egttools.helpers
    - egttools.plotting
    - egttools.numerical.mpi   # no-op import (empty __all__) when MPI not built
  source_files:
    - tests
  requires:
    - pytest
{% if use_mpi %}
    - mpi4py >=3.1
{% endif %}
  commands:
    - pytest tests/ -x -q --ignore=tests/cpp

about:
  home: "https://github.com/Socrats/EGTTools"
  summary: "Evolutionary Game Theory tools for Python with C++ acceleration."
  license: GPL-3.0-or-later
  license_file: LICENSE
  description: |
    EGTtools provides high-performance tools to study evolutionary game dynamics,
    including analytical methods, simulations, and visualization utilities.

    Build variants
    --------------
    egttools (base)         — power iteration stationary solver; no extra deps.
    egttools (arpack)       — adds ARPACK native C++ eigensolver; requires arpack.
    egttools (mpi)          — adds PETSc/SLEPc MPI-distributed solver;
                              requires petsc, slepc, mpi4py.
    egttools (arpack + mpi) — both solvers enabled.
  doc_url: "https://egttools.readthedocs.io"

extra:
  recipe-maintainers:
    - Socrats
