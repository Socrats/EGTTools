{% set name = "egttools" %}
{% set version = "0.1.15" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ../.

build:
  noarch: false  # C++ extension: NOT noarch
  number: 0
  script_env:
    # Passed to CMake so it can generate version.h without a git checkout
    # (conda-forge builds from a PyPI sdist tarball, so .git is absent).
    - EGTTOOLS_VERSION={{ version }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.27
    - ninja
  host:
    - python
    - pip
    - scikit-build >=0.13.1
    - setuptools >=44
    - wheel
    - pybind11 >=2.10
    - numpy >=1.26.3
    - eigen >=3.4.0
    - boost-cpp >=1.82.0
    - libblas
    - liblapack
    - liblapacke
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
  run:
    - python
    - numpy >=1.26.3
    - scipy >=1.12.0
    - matplotlib >=3.8.2
    - seaborn >=0.13.2
    - networkx >=3.2.1
    - plotly >=5.0.0
    - libblas
    - liblapack
    - llvm-openmp  # [osx]
    - libgomp      # [linux]

test:
  imports:
    - egttools
    - egttools.numerical
    - egttools.games
    - egttools.behaviors
    - egttools.analytical
    - egttools.datastructures
    - egttools.helpers
    - egttools.plotting
  source_files:
    - tests
  requires:
    - pytest
  commands:
    - pytest tests/ -x -q --ignore=tests/cpp

about:
  home: "https://github.com/Socrats/EGTTools"
  summary: "Evolutionary Game Theory tools for Python with C++ acceleration."
  license: GPL-3.0-or-later
  license_file: LICENSE
  description: |
    EGTtools provides high-performance tools to study evolutionary game dynamics,
    including analytical methods, simulations, and visualization utilities.
  doc_url: "https://egttools.readthedocs.io"

extra:
  recipe-maintainers:
    - Socrats
