[build-system]
requires = [
    "setuptools>=44",
    "wheel",
    "scikit-build>=0.13.1",
    "cmake>=3.18",
    "ninja; platform_system!='Windows'",
    "setuptools-scm>=7",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Writes the version to _version.py at build time so it's available
# in Python without importing the C++ extension.
write_to = "src/egttools/_version.py"
# Drop the local version segment (e.g. +g1234abc) — conda and pip extras
# don't support PEP 440 local identifiers well.
local_scheme = "no-local-version"
# Fallback used when building from an sdist without a git checkout
# (e.g. conda-forge builds from a PyPI tarball).
fallback_version = "0.0.0"

[tool.scikit-build]
experimental = true
cmake.version = ">=3.27"
wheel.py-api = "cp310"
wheel.expand-macos-universal-tags = true
cmake.args = [
    "-DUSE_OPENMP=ON",
    "-G", "Ninja"
]
build.verbose = true
logging.level = "INFO"

[project]
name = "egttools"
dynamic = ["version"]
description = "Efficient Python library for Evolutionary Game Theory (EGT)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Elias F. Domingos", email = "elias.fernandez.domingos@vub.be" },
]
maintainers = [
    { name = "Elias F. Domingos", email = "elias.fernandez.domingos@vub.be" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { "Homepage" = "https://github.com/Socrats/EGTTools", "Bug Tracker" = "https://github.com/Socrats/EGTTools/issues", "Documentation" = "https://egttools.readthedocs.io/en/latest/" }
keywords = ["evolutionary game theory", "EGT", "python", "library", "scientific computing"]
dependencies = [
    "numpy>=1.26.3",
    "scipy>=1.12.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.2",
    "networkx>=3.2.1",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
docs = [
    "numpy>=1.24",
    "scipy>=1.10.1",
    "matplotlib>=3.7.1",
    "pandas>=2.0.1",
    "networkx>=3.1",
    "pybind11>=2.10",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0.0",
    "nbsphinx>=0.9.3",
    "sphinx-autodoc-typehints>=1.25.2",
    "sphinxcontrib-bibtex>=2.6.1",
    "pygments",
    "docutils",
    "prompt-toolkit",
    "pandoc",
    "ipykernel",
    "ipywidgets",
    "gitpython>=3.1.31",
    "PyGithub>=1.58.0",
    "requests>=2.29.0",
    "beautifulsoup4>=4.12.2",
]

docs-minimal = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "furo",
]

[tool.setuptools.package-data]
egttools = [
    "py.typed",
    "*.pyi",
    "numerical/*.pyi",
    "games/*.pyi",
    "helpers/*.pyi",
    "plotting/*.pyi",
]
"egttools.numerical" = [
    "*.so",
    "*.dylib",
    "*.pyd",
    "*.pyi",
    "lib/*.dylib",
    "lib/*.so",
    "numerical_/*.pyi",
    "numerical_/**/*.pyi",
]

[tool.check-manifest]
ignore = [
    "PKG-INFO",
    "*.egg-info",
    "*.egg-info/*",
    "setup.cfg",
    ".hgtags",
    ".hgsigs",
    ".hgignore",
    ".gitignore",
    ".bzrignore",
    ".gitattributes",
    ".github/*",
    ".travis.yml",
    "enkinsfile",
    "*.mo",
]

[tool.cibuildwheel]
build-frontend = "pip"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
addopts = """
    --ignore build_tools
    --ignore docs
    --ignore pybind11
    --disable-pytest-warnings
    -rxXs
"""
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]